<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin · DNSC e-Clearance</title><link rel="stylesheet" href="css/styles.css"><script>try{document.documentElement.dataset.theme=localStorage.theme||"light"}catch(e){}</script></head><body>
<div id="bar" class="bar"></div>
<main id="app"></main><div id="toast" hidden role="status"></div>
<script src="js/api.js"></script><script src="js/ui.js"></script>
<script>
(async()=>{const u=await guard(['admin']);if(!u)return;const out=h('div'),tbl=(hd,rows)=>h('div',{class:'tw'},h('table',{},h('thead',{},h('tr',{},...hd.map(x=>h('th',{},x)))),h('tbody',{},...rows.map(r=>h('tr',{},...r.map(c=>h('td',{},c)))))));
const imps=async()=>{try{const r=await api('GET','/imports');out.replaceChildren(tbl(['File','Status','Accepted','Rejected'],r.data.map(i=>[i.filename,i.status+(i.reject_reason?' ('+i.reject_reason+')':''),i.accepted_rows,i.rejected_rows])))}catch(e){toast(e.message)}};
const aud=async()=>{try{const [r,v]=await Promise.all([api('GET','/audit-log'),api('GET','/audit-log?verify=true')]);out.replaceChildren(h('p',{},h('span',{class:'badge '+(v.chain_valid?'ok':'hold')},v.chain_valid?'✓ Chain intact':'! Chain broken')),tbl(['Time','Role','Action','Target'],r.data.map(a=>[fmt(a.ts),a.actor_role,a.action,a.target_id])))}catch(e){toast(e.message)}};
$('#app').replaceChildren(h('div',{class:'card'},h('div',{class:'row'},h('h2',{},'Admin'),h('span',{},h('button',{class:'btn alt',onclick:imps},'Imports'),' ',h('button',{class:'btn alt',onclick:aud},'Audit log'),' ',h('button',{class:'btn',onclick:async()=>{try{await api('POST','/imports/run');toast('Import started');imps()}catch(e){toast(e.message)}}},'Run import'))),out,h('p',{class:'muted'},h('a',{href:'reports.html'},'Reports'))));imps()})();
</script></body></html>
