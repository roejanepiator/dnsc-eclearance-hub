<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My profile · DNSC e-Clearance</title><link rel="stylesheet" href="css/styles.css"><script>try{document.documentElement.dataset.theme=localStorage.theme||"light"}catch(e){}</script></head><body>
<div id="bar" class="bar"></div>
<main id="app"></main><div id="toast" hidden role="status"></div>
<script src="js/api.js"></script><script src="js/ui.js"></script>
<script>
(async()=>{const u=await guard(['student','staff','admin']);if(!u)return;
const rows=[['Username',u.username],['Role',u.role],u.office?['Office',office(u.office)]:null,u.student_id?['Student ID',u.student_id]:null,['Session','Signed in for 30 minutes']].filter(Boolean);
$('#app').replaceChildren(h('div',{class:'card'},h('div',{class:'brand'},h('div',{class:'mark','aria-hidden':'true'},initials(u.display_name)),h('div',{},h('b',{},u.display_name),h('span',{},u.role+(u.office?' · '+office(u.office):'')))),...rows.map(([k,v])=>h('div',{class:'row'},h('span',{class:'muted'},k),h('span',{},v)))),
h('div',{class:'card'},h('h2',{},'Privacy'),h('p',{class:'muted'},'Your data is handled under the Data Privacy Act (RA 10173). Only the information needed for clearance is shown here.')))})();
</script></body></html>
