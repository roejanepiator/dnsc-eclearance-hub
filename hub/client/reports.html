<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reports · DNSC e-Clearance</title><link rel="stylesheet" href="css/styles.css"><script>try{document.documentElement.dataset.theme=localStorage.theme||"light"}catch(e){}</script></head><body>
<div id="bar" class="bar"></div>
<main id="app"></main><div id="toast" hidden role="status"></div>
<script src="js/api.js"></script><script src="js/ui.js"></script>
<script>
(async()=>{const u=await guard(['staff','admin']);if(!u)return;const f=h('select',{'aria-label':'Format'},...['csv','json','xml'].map(x=>h('option',{value:x},x.toUpperCase())));
$('#app').replaceChildren(h('div',{class:'card'},h('h2',{},'Clearance report'),h('p',{class:'muted'},'Student IDs are masked in every export.'),h('div',{class:'row'},f,h('button',{class:'btn',onclick:async()=>{try{const b=await api('GET','/reports/clearance?format='+f.value,null,true),a=h('a',{href:URL.createObjectURL(b),download:'clearance.'+f.value});document.body.append(a);a.click();a.remove();toast('Export ready')}catch(e){toast(e.message)}}},'Export'))))})();
</script></body></html>
